# ============================================================================
# dsh-genshin-pet 的 bundle patch —— 把桌宠插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是 dsh-genshin-pet 的"挂载声明"。DSH 启动时按 bundle 层栈把各个插件的
#   patch 叠起来组成配置树。本文件就是这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - 每个 entry 有 id（行标识，patch 覆盖时按它定位）和 name（插件模块）
#   - id 必须全局唯一且与包名一致：DSH STORE 上架契约按它比对 entryIds，
#     裸名（如 pet）会与其它插件的行标识冲突，候选会被判为缺少 entry ID
#   - 插件行那一行（"id: 值"）绝不能写行尾注释：商城预检（check-plugin-submission.mjs）
#     用正则抓该行的值并要求其后直接换行，行尾注释会让它抓不到 entry ID，
#     整份提交被判 SUBMISSION_ENTRY_MISSING（与 id 叫什么名字无关）
#   - name 会解析包入口 lib/index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.client，DSH 的模块系统同时会把
#     这个包扫描为"浏览器插件"，提供 /plugins/dsh-genshin-pet/client.js 给页面
#
# 【与上游 dsh-pet 的关系，2026-10-30】
#   本包从 PC2005-cloud/dsh-pet 派生（MIT），只保留了本项目原创的两只角色。
#   id 已随包名改为 dsh-genshin-pet，所以**本包与上游 dsh-pet 不能同时安装**：
#   两者会注入同一套前端路由前缀（/dsh-pet-7340）与同一份用户数据目录
#   （$DSH_HOME/dsh-pet），同时装会出现两只宠物抢同一份配置。
#   如果要换回上游，请先卸载本包。
#
# ============================================================================

- insert:
    - id: dsh-genshin-pet
      name: 'dsh-genshin-pet'
